[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "3.0.0"
description = "JARVIS 2 — osobní hlasový a chatový AI asistent pro Windows + Android"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic>=2.6",
  "tomli-w>=1.0",
  "keyring>=25",
  "psutil>=5.9",
  "pillow>=10",
  "qrcode>=7.4",
  "yt-dlp>=2024.1.1",
  "ddgs>=9",
  "trafilatura>=1.8",
  "pypdf>=4",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.23",
  "edge-tts>=6.1",
  "mcp>=1.2",
  "numpy>=1.26",
  "icalendar>=6",
  "recurring-ical-events>=3",
  "av>=12",
  "cryptography>=42",
  "anthropic>=1",          # 3.14 Claude through Anthropic's own API (llm/claude.py)
]

[project.optional-dependencies]
desktop = [
  "pywebview>=5",
  "pystray>=0.19",
  "pyserial>=3.5",
  "keyboard>=0.13",
  "pyautogui>=0.9.54",
  "mss>=9",
  "pyperclip>=1.8",
  "pycaw>=20240210; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
  "winsdk>=1.0.0b10; sys_platform == 'win32'",
  "uiautomation>=2.0.20; sys_platform == 'win32'",
  "playwright>=1.44",
  "matplotlib>=3.8",
  "send2trash>=1.8",
  "soundcard>=0.4.6; sys_platform == 'win32'",
  "onnxruntime>=1.17",       # 3.14 search by meaning inside JARVIS (embedder.py)
  "tokenizers>=0.19",
  "opencv-python-headless>=4.9,<5",   # 3.14 webcam features, all opt-in (4.x: the built-in face finder; 5.x moved it out)
]
voice = [
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "webrtcvad-wheels>=2.0.11",
  "openwakeword>=0.4",
  "faster-whisper>=1.0",
  "piper-tts>=1.2",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-timeout>=2.3", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.10"]

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 60

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
# real bugs only: undefined names, syntax, unused things, mutable defaults, dangling tasks, odd unicode
select = ["F", "E9", "E7", "B", "RUF006", "PLE"]
# reviewed and kept on purpose: one-line `a; b`, short names (l, I), small lambdas, zip() over equal-length lists,
# unused loop variables in unpacking, lambdas that run inside the same loop round (B023), pytest.raises(Exception)
ignore = ["E702", "E741", "E731", "B905", "B007", "B023", "B017", "B008", "B904", "B027", "B024"]

[tool.ruff.lint.per-file-ignores]
"jarvis/testlab.py" = ["PLE2502"]   # the fuzz values contain a right-to-left mark on purpose

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = false
check_untyped_defs = false
# the typed core first; more modules join the list as they get annotated
files = ["jarvis/llm", "jarvis/evals", "jarvis/quality.py", "jarvis/redact.py", "jarvis/events.py", "jarvis/brainplus.py",
         "jarvis/offlinepack.py", "jarvis/server/handlers", "jarvis/voice/voiceid.py", "jarvis/voice/style.py",
         "jarvis/embedder.py", "jarvis/memplus.py", "jarvis/proactiveplus.py", "jarvis/notchplus.py", "jarvis/pcplus.py", "jarvis/phoneplus.py", "jarvis/obs.py", "jarvis/skillpack.py",
         "jarvis/shield.py", "jarvis/sandbox.py", "jarvis/skillheal.py", "jarvis/stats.py", "jarvis/brainpick.py", "jarvis/nowplaying.py", "jarvis/lyricsync.py",
         "jarvis/persona.py", "jarvis/house.py", "jarvis/energy.py", "jarvis/nodes.py", "jarvis/eyes.py", "jarvis/safety.py", "jarvis/body.py",
         "jarvis/car.py", "jarvis/travel.py", "jarvis/parcels.py",
         "jarvis/callagent.py", "jarvis/chatdigest.py", "jarvis/server/callroutes.py",
         "jarvis/nightlearn.py", "jarvis/lifelog.py", "jarvis/quests.py", "jarvis/whatif.py", "jarvis/robots.py", "jarvis/fxrender.py", "jarvis/overlayfx.py", "jarvis/livecards.py", "jarvis/cad.py", "jarvis/sims.py", "jarvis/printer3d.py", "jarvis/workbench.py", "jarvis/models3d.py", "jarvis/toolcatalog.py", "jarvis/latency.py", "jarvis/toolmind.py", "jarvis/voice/fastear.py", "jarvis/quickcmd.py", "jarvis/prefetch.py", "jarvis/reflexmodel.py", "jarvis/speedcheck.py", "jarvis/speedwizard.py", "jarvis/voice/streamplay.py", "jarvis/handmodel.py", "jarvis/bambu.py", "jarvis/minimqtt.py", "jarvis/integrationcheck.py", "jarvis/printcheck.py", "jarvis/timelapse.py", "jarvis/resmon.py", "jarvis/webpush.py", "jarvis/watchpair.py", "jarvis/booking.py", "jarvis/travelsearch.py", "jarvis/tripcare.py", "jarvis/tools/booking_tools.py", "jarvis/connectors/travelapis.py"]
