plugins {
    id "com.android.application"
}

android {
    namespace "cz.adamekk.jarvis.wear"
    compileSdk 35

    defaultConfig {
        applicationId "cz.adamekk.jarvis.wear"
        minSdk 30
        targetSdk 34
        versionCode 320
        versionName "3.20"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

dependencies {
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"   // 3.20 (151) the complication
    implementation "com.google.guava:guava:33.3.1-android"
}
