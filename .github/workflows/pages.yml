# 3.14 návrh 116: the project web page (site/) on GitHub Pages.
# One-time step for the repository owner: Settings → Pages → Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main, master]
    paths: ["site/**", "docs/**", "README.md", "SECURITY.md", "CONTRIBUTING.md", "packaging/build_docs.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: Docs website (3.20)
        run: python3 packaging/build_docs.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
