name: Build JARVIS

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JARVIS_VERSION: 3.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "./core[dev]"
      - run: cd core && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  windows:
    needs: [web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install JARVIS + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install "./core[desktop,voice,dev]" pyinstaller
      - name: Tests on Windows
        run: cd core; pytest -q -x
      - name: PyInstaller
        run: cd packaging; pyinstaller jarvis.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Smoke test JARVIS.exe
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome"
          $p = Start-Process -FilePath dist\JARVIS\JARVIS-debug.exe -ArgumentList "--no-ui","--no-voice","--debug" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($p.HasExited) { Write-Host "process exited with $($p.ExitCode)"; break }
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($r.name -eq "JARVIS") { $ok = $true; break } } catch {}
          }
          Write-Host "== stdout"; Get-Content "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Write-Host "== stderr"; Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 80
          foreach ($f in "crash.log","fault.log","logs\jarvis.log") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "JARVIS-debug.exe did not start" }
      - name: Smoke test windowed JARVIS.exe
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome2"
          $p = Start-Process -FilePath dist\JARVIS\JARVIS.exe -ArgumentList "--no-ui","--no-voice" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "process exited with $($p.ExitCode)"; break }
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($r.name -eq "JARVIS") { $ok = $true; break } } catch {}
          }
          if (-not $ok) {
            Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\screen.png")
            foreach ($f in "crash.log","fault.log","logs\jarvis.log") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          "$ok" | Out-File "$env:RUNNER_TEMP\windowed_ok.txt"
          if (-not $ok) { throw "windowed JARVIS.exe did not start" }
      - name: Notch on real Windows (window region + screenshots)
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome5"
          $env:JARVIS_NO_NET = "1"
          $shots = "$env:RUNNER_TEMP\notch-shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          $p = Start-Process -FilePath dist\JARVIS\JARVIS.exe -ArgumentList "--no-voice" -PassThru
          for ($i = 0; $i -lt 45; $i++) { Start-Sleep -Seconds 2; try { if ((Invoke-RestMethod http://127.0.0.1:8765/api/health).name -eq "JARVIS") { break } } catch {} }
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern int GetWindowRgnBox(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            // a visible window of this process whose title contains the needle ("Notch", "JARVIS Chat")
            public static IntPtr Notch(uint pid, System.Collections.Generic.List<string> seen) { return Find(pid, seen, "Notch"); }
            public static IntPtr Find(uint pid, System.Collections.Generic.List<string> seen, string needle) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) { var sb = new System.Text.StringBuilder(256); GetWindowText(h, sb, 256);
                  seen.Add(sb.ToString()); if (sb.ToString().Contains(needle)) { found = h; return false; } }
                return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $w = [Math]::Min(1200, $b.Width); $x = [int](($b.Width - $w) / 2)
            $bmp = New-Object System.Drawing.Bitmap $w, 480
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($x, 0, 0, 0, $bmp.Size)
            $bmp.Save("$shots\$name.png")
          }
          function Region($label) {
            $seen = New-Object 'System.Collections.Generic.List[string]'
            $h = [W]::Notch([uint32]$p.Id, $seen)
            if ($h -eq [IntPtr]::Zero) { Write-Host "windows of JARVIS: $($seen -join ' | ')" }
            $wr = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$wr) | Out-Null
            $rr = New-Object W+RECT; $kind = [W]::GetWindowRgnBox($h, [ref]$rr)
            $line = "$label hwnd=$h window=($($wr.L),$($wr.T))-($($wr.R),$($wr.B)) regionKind=$kind box=($($rr.L),$($rr.T))-($($rr.R),$($rr.B))"
            Write-Host $line; Add-Content "$shots\region.txt" $line
            return $kind
          }
          function Zoom($label) {
            # the notch window enlarged 6x without smoothing: jagged steps vs. anti-aliased edges are plain to see
            $seen = New-Object 'System.Collections.Generic.List[string]'
            $h = [W]::Notch([uint32]$p.Id, $seen)
            $wr = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$wr) | Out-Null
            $w = $wr.R - $wr.L; $hh = [Math]::Min(140, $wr.B - $wr.T)
            if ($w -le 0 -or $hh -le 0) { return }
            $src = New-Object System.Drawing.Bitmap $w, $hh
            [System.Drawing.Graphics]::FromImage($src).CopyFromScreen($wr.L, $wr.T, 0, 0, $src.Size)
            # edge pixels that are neither the black notch nor the pink backdrop = anti-aliasing
            $aa = 0
            for ($y = 0; $y -lt $hh; $y++) { for ($x = 0; $x -lt $w; $x++) { $c = $src.GetPixel($x, $y)
              if ($c.R -gt 40 -and $c.R -lt 215 -and [Math]::Abs($c.G - $c.R * 0.2) -lt 30 -and [Math]::Abs($c.B - $c.R * 0.4) -lt 30) { $aa++ } } }
            $big = New-Object System.Drawing.Bitmap ($w * 6), ($hh * 6)
            $g = [System.Drawing.Graphics]::FromImage($big)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::NearestNeighbor
            $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::Half
            $g.DrawImage($src, 0, 0, $big.Width, $big.Height); $big.Save("$shots\zoom-$label.png")
            $line = "zoom $label antialiased-edge-pixels=$aa"; Write-Host $line; Add-Content "$shots\region.txt" $line
          }
          # a bright backdrop under the notch (black consoles would hide jagged or smooth edges alike)
          $bd = New-Object System.Windows.Forms.Form
          $bd.FormBorderStyle = 'None'; $bd.BackColor = [System.Drawing.Color]::FromArgb(255, 255, 51, 102); $bd.ShowInTaskbar = $false
          $bd.StartPosition = 'Manual'; $bd.Bounds = New-Object System.Drawing.Rectangle 0, 0, [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width, 320
          $bd.Show(); [System.Windows.Forms.Application]::DoEvents()
          $sw = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
          [W]::SetCursorPos(10, 700) | Out-Null; Start-Sleep -Seconds 2; [System.Windows.Forms.Application]::DoEvents()
          Shot "1-closed"; $k1 = Region "closed"; Zoom "closed"
          [W]::SetCursorPos([int]($sw / 2), 8) | Out-Null; Start-Sleep -Milliseconds 1500
          [System.Windows.Forms.Application]::DoEvents()
          Shot "2-hover"; $k2 = Region "hover"; Zoom "hover"
          [W]::SetCursorPos(10, 700) | Out-Null; Start-Sleep -Seconds 2
          Shot "3-after"; $k3 = Region "after"
          $bd.Close()
          $smooth = Select-String -Path "$env:JARVIS_HOME\logs\jarvis.log" -Pattern "smooth edges" -ErrorAction SilentlyContinue | Select-Object -Last 1
          $line = "smooth: $smooth"; Write-Host $line; Add-Content "$shots\region.txt" $line
          # 3.1: "Otevřít celý chat" creates a maximized window after start-up
          Invoke-RestMethod -Method Post "http://127.0.0.1:8765/api/show?view=full" | Out-Null
          $full = [IntPtr]::Zero; $seen = New-Object 'System.Collections.Generic.List[string]'
          for ($i = 0; $i -lt 20 -and $full -eq [IntPtr]::Zero; $i++) { Start-Sleep -Seconds 1; $seen.Clear(); $full = [W]::Find([uint32]$p.Id, $seen, "JARVIS Chat") }
          Start-Sleep -Seconds 4
          $sb = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $sb.Width, $sb.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size); $bmp.Save("$shots\4-full-chat.png")
          $fr = New-Object W+RECT; [W]::GetWindowRect($full, [ref]$fr) | Out-Null
          $fullLine = "full chat hwnd=$full window=($($fr.L),$($fr.T))-($($fr.R),$($fr.B)) windows=$($seen -join ' | ')"
          Write-Host $fullLine; Add-Content "$shots\region.txt" $fullLine
          foreach ($f in "crash.log","logs\jarvis.log") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 30 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          # 0 = ERROR (no region), 1 = NULLREGION: the notch would show a box around it
          if ($k1 -lt 2) { throw "the notch window has no region: there would be a box around the notch" }
          if ($full -eq [IntPtr]::Zero) { throw "the full chat window did not open" }
          if (($fr.R - $fr.L) -lt $sb.Width * 0.8) { throw "the full chat window is not maximized" }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: notch-shots, path: "${{ runner.temp }}/notch-shots" }
      - name: Idle benchmark and UI Automation selftest
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome3"
          $env:JARVIS_NO_NET = "1"
          $bench = & dist\JARVIS\JARVIS-debug.exe --bench 30 --bench-gate 2>$null
          $code = $LASTEXITCODE
          Write-Host "BENCH (targets: CPU < 2 %, RAM < 400 MB; gate 2x): $($bench | Select-Object -Last 1)"
          $uia = & dist\JARVIS\JARVIS-debug.exe --selftest-uia 2>$null
          Write-Host "UIA SELFTEST: $($uia | Select-Object -Last 1)"
          if ($code -ne 0) { throw "idle cost above 2x target" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: windowed-screen, path: "${{ runner.temp }}/screen.png" }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:JARVIS_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Installer smoke test (fresh install, then an upgrade over it, then start)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\jarvis-installed"
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome4"
          $env:JARVIS_NO_NET = "1"
          foreach ($i in 1..2) {
            $log = "$env:RUNNER_TEMP\setup$i.log"
            # -Wait would also wait for the JARVIS the setup starts at the end: wait for the setup only
            $p = Start-Process dist\JARVIS-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=`"$d`"", "/LOG=`"$log`"" -PassThru
            if (-not $p.WaitForExit(300000)) { Get-Content $log -Tail 60; throw "setup #$i did not finish in 5 minutes" }
            Start-Sleep -Seconds 3
            Get-Process JARVIS -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "setup #$i failed with exit code $($p.ExitCode)" }
          }
          if (-not (Test-Path "$d\JARVIS.exe")) { throw "JARVIS.exe missing after install" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JARVIS.lnk")) { Write-Host "warning: Start menu shortcut missing" }
          $out = & "$d\JARVIS-debug.exe" --bench 5 2>&1 | Select-Object -Last 20
          $code = $LASTEXITCODE
          Write-Host ($out | Select-Object -Last 3)
          if ($code -ne 0) { Get-Content "$env:JARVIS_HOME\crash.log" -ErrorAction SilentlyContinue; throw "the installed JARVIS does not start" }
      - uses: actions/upload-artifact@v4
        with: { name: JARVIS-Setup, path: dist/JARVIS-Setup.exe }

  android:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: bash mobile/build-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: JARVIS-apk, path: mobile/JARVIS.apk }

  release:
    needs: [test, windows, android]
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.JARVIS_VERSION }}
          name: JARVIS ${{ env.JARVIS_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Stáhni a nainstaluj
            - **PC (Windows 10/11):** `JARVIS-Setup.exe` → spusť a klikni Další.
            - **Telefon (Android):** `JARVIS.apk` → otevři v telefonu, povol instalaci z tohoto zdroje.
            - Spárování: na PC otevři JARVIS → Telefon a naskenuj QR kód v aplikaci.
          files: |
            out/JARVIS-Setup.exe
            out/JARVIS.apk
