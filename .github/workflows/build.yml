name: Build JARVIS

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JARVIS_VERSION: 2.1.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "./core[dev]"
      - run: cd core && pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run build
      - uses: actions/upload-artifact@v4
        with: { name: web-dist, path: web/dist }

  windows:
    needs: [web]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install JARVIS + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install "./core[desktop,voice,dev]" pyinstaller
      - name: Tests on Windows
        run: cd core; pytest -q -x
      - name: PyInstaller
        run: cd packaging; pyinstaller jarvis.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Smoke test JARVIS.exe
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome"
          $p = Start-Process -FilePath dist\JARVIS\JARVIS-debug.exe -ArgumentList "--no-ui","--no-voice","--debug" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($p.HasExited) { Write-Host "process exited with $($p.ExitCode)"; break }
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($r.name -eq "JARVIS") { $ok = $true; break } } catch {}
          }
          Write-Host "== stdout"; Get-Content "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Write-Host "== stderr"; Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 80
          foreach ($f in "crash.log","fault.log","logs\jarvis.log") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "JARVIS-debug.exe did not start" }
      - name: Smoke test windowed JARVIS.exe
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome2"
          $p = Start-Process -FilePath dist\JARVIS\JARVIS.exe -ArgumentList "--no-ui","--no-voice" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "process exited with $($p.ExitCode)"; break }
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/api/health; if ($r.name -eq "JARVIS") { $ok = $true; break } } catch {}
          }
          if (-not $ok) {
            Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\screen.png")
            foreach ($f in "crash.log","fault.log","logs\jarvis.log") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          "$ok" | Out-File "$env:RUNNER_TEMP\windowed_ok.txt"
          if (-not $ok) { throw "windowed JARVIS.exe did not start" }
      - name: Idle benchmark and UI Automation selftest
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome3"
          $env:JARVIS_NO_NET = "1"
          $bench = & dist\JARVIS\JARVIS-debug.exe --bench 30 --bench-gate 2>$null
          $code = $LASTEXITCODE
          Write-Host "BENCH (targets: CPU < 2 %, RAM < 400 MB; gate 2x): $($bench | Select-Object -Last 1)"
          $uia = & dist\JARVIS\JARVIS-debug.exe --selftest-uia 2>$null
          Write-Host "UIA SELFTEST: $($uia | Select-Object -Last 1)"
          if ($code -ne 0) { throw "idle cost above 2x target" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: windowed-screen, path: "${{ runner.temp }}/screen.png" }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:JARVIS_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - uses: actions/upload-artifact@v4
        with: { name: JARVIS-Setup, path: dist/JARVIS-Setup.exe }

  android:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: web-dist, path: web/dist }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: bash mobile/build-android.sh
      - uses: actions/upload-artifact@v4
        with: { name: JARVIS-apk, path: mobile/JARVIS.apk }

  release:
    needs: [test, windows, android]
    if: github.ref_name == github.event.repository.default_branch || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.JARVIS_VERSION }}
          name: JARVIS ${{ env.JARVIS_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Stáhni a nainstaluj
            - **PC (Windows 10/11):** `JARVIS-Setup.exe` → spusť a klikni Další.
            - **Telefon (Android):** `JARVIS.apk` → otevři v telefonu, povol instalaci z tohoto zdroje.
            - Spárování: na PC otevři JARVIS → Telefon a naskenuj QR kód v aplikaci.
          files: |
            out/JARVIS-Setup.exe
            out/JARVIS.apk
