name: Build JARVIS

on:
  push:
    branches: ["**"]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  JARVIS_VERSION: 3.10.${{ github.run_number }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e "./core[dev]"
      - name: Lint (ruff – real bugs only, see core/pyproject.toml)
        run: cd core && ruff check jarvis tests
      - name: Types (mypy on the typed core)
        run: cd core && mypy
      - run: cd core && pytest -q
      - name: Quality evals (offline – which tools a Czech request reaches, the instant commands)
        run: cd core && python -m jarvis.evals --offline --min-score 0.9

  audit:
    # known holes in the libraries JARVIS ships with; reported on every build, never blocks a release by itself
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install pip-audit && pip install "./core"
      - name: pip-audit (Python packages)
        run: pip-audit --progress-spinner off --skip-editable
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: npm audit (web UI, production packages)
        run: cd web && npm ci --no-audit --no-fund && npm audit --omit=dev --audit-level=high

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && npm run lint && npm test && npm run build
      # build outputs travel through the cache, not artifacts: the artifact quota filled up and blocked releases,
      # the cache evicts old entries by itself
      - uses: actions/cache/save@v4
        with:
          path: web/dist
          key: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  ui-check:
    # every page in a real browser at three sizes against a real JARVIS server: script errors, pages spilling
    # sideways, clipped buttons, the notch off its window; the screenshots are kept for a look (návrh 21)
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: web/dist
          key: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: pip install -e "./core[dev]"
      - run: cd web && npm install --no-save --no-audit --no-fund playwright@1 axe-core@4 && npx playwright install --with-deps chromium
      - run: cd core && JARVIS_HOME=$RUNNER_TEMP/jhome python -m jarvis.uicheck --out $RUNNER_TEMP/uicheck
      - run: cd core && JARVIS_HOME=$RUNNER_TEMP/jhome-en python -m jarvis.uicheck --lang en --out $RUNNER_TEMP/uicheck/en
      - uses: actions/upload-artifact@v5
        if: always()
        continue-on-error: true
        with: { name: ui-screenshots, path: "${{ runner.temp }}/uicheck", retention-days: 7 }

  # 3.19 the tests on real Windows run in two parts beside the build (before: ~17 min of tests, then the build)
  windows-tests:
    needs: [web]
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/2", "2/2"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: web/dist
          key: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - name: Install JARVIS
        run: |
          python -m pip install --upgrade pip
          pip install "./core[desktop,voice,dev]"
          python -c "import openwakeword.utils as u; u.download_models(['hey_jarvis'])"
      - name: Tests on Windows (part ${{ matrix.shard }})
        env:
          JARVIS_TEST_SHARD: ${{ matrix.shard }}
        run: cd core; pytest -q -x

  windows:
    needs: [web]
    runs-on: windows-latest
    env:
      HAS_SIGNING_CERT: ${{ secrets.WINDOWS_CERT_PFX != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: web/dist
          key: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - name: Version into the app (Settings, updates and the "Co je nového" check read it)
        shell: pwsh
        run: Set-Content -Encoding utf8 core/jarvis/_version.py "VERSION = `"$env:JARVIS_VERSION`"`n"
      - name: Install JARVIS + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install "./core[desktop,voice,dev]" pyinstaller
          # the "Jarvis" wake word models go INTO the installer – before, JARVIS downloaded them after every update
          # and the voice was not ready (or not there at all when the internet was blocked)
          python -c "import openwakeword.utils as u; u.download_models(['hey_jarvis'])"
      - name: PyInstaller
        timeout-minutes: 25      # normally 4–5 min; a hang must end with a log, not after 6 hours
        run: cd packaging; pyinstaller jarvis.spec --noconfirm --distpath ../dist --workpath ../build
      - name: Sign JARVIS.exe (only when a code-signing certificate is in the repository secrets)
        # Settings → Secrets → Actions: WINDOWS_CERT_PFX (the .pfx as base64) + WINDOWS_CERT_PASSWORD. Without them the
        # build stays unsigned (SmartScreen then warns once); see docs/SIGNING.md
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\JARVIS\JARVIS.exe dist\JARVIS\JARVIS-debug.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
      - name: Bundle size by package (what makes the installer big)
        shell: pwsh
        run: |
          $root = "dist\JARVIS\_internal"
          $total = (Get-ChildItem dist\JARVIS -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("BUNDLE total {0:N0} MB, {1} files" -f ($total / 1MB), (Get-ChildItem dist\JARVIS -Recurse -File).Count)
          Get-ChildItem $root | ForEach-Object {
            $size = if ($_.PSIsContainer) { (Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum } else { $_.Length }
            [pscustomobject]@{ Name = $_.Name; MB = [math]::Round($size / 1MB, 1) }
          } | Sort-Object MB -Descending | Select-Object -First 30 | ForEach-Object { Write-Host ("BUNDLE {0,8} MB  {1}" -f $_.MB, $_.Name) }
      - name: Smoke test JARVIS.exe
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome"
          $p = Start-Process -FilePath dist\JARVIS\JARVIS-debug.exe -ArgumentList "--no-ui","--no-voice","--debug" -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\out.txt" -RedirectStandardError "$env:RUNNER_TEMP\err.txt"
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            if ($p.HasExited) { Write-Host "process exited with $($p.ExitCode)"; break }
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod -TimeoutSec 30 http://127.0.0.1:8765/api/health; if ($r.name -eq "JARVIS") { $ok = $true; break } } catch {}
          }
          Write-Host "== stdout"; Get-Content "$env:RUNNER_TEMP\out.txt" -ErrorAction SilentlyContinue | Select-Object -Last 60
          Write-Host "== stderr"; Get-Content "$env:RUNNER_TEMP\err.txt" -ErrorAction SilentlyContinue | Select-Object -Last 80
          foreach ($f in "crash.log","fault.log","logs\jarvis.log","logs\hang-dump.txt") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "JARVIS-debug.exe did not start" }
          # the version the app reports decides whether it offers an update: it must be this build's, not 3.10.0
          if ($r.version -ne $env:JARVIS_VERSION) { throw "JARVIS reports version $($r.version), the build is $env:JARVIS_VERSION" }
      - name: Kontrola funkcí in the packaged app (are the Windows parts for music, sound and microphone there?)
        shell: pwsh
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome-sc"
          $env:JARVIS_NO_NET = "1"
          & dist\JARVIS\JARVIS-debug.exe --selfcheck 2>&1 | ForEach-Object { Write-Host "SELFCHECK $_" }
      - name: Internet on real Windows (AI services, lyrics, covers, weather, updates – inside the packaged JARVIS.exe)
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome-net"
          & dist\JARVIS\JARVIS-debug.exe --netcheck 2>&1 | ForEach-Object { Write-Host "NETCHECK $_" }
          if ($LASTEXITCODE -ne 0) { Write-Host "::warning::Internet check on Windows: something failed (see NETCHECK lines)"; exit 1 }
      - name: Smoke test windowed JARVIS.exe
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome2"
          $p = Start-Process -FilePath dist\JARVIS\JARVIS.exe -ArgumentList "--no-ui","--no-voice" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 45; $i++) {
            Start-Sleep -Seconds 2
            if ($p.HasExited) { Write-Host "process exited with $($p.ExitCode)"; break }
            try { $r = Invoke-RestMethod -TimeoutSec 30 http://127.0.0.1:8765/api/health; if ($r.name -eq "JARVIS") { $ok = $true; break } } catch {}
          }
          if (-not $ok) {
            Get-Process | Where-Object { $_.MainWindowTitle } | Select-Object ProcessName, MainWindowTitle | Format-Table -AutoSize | Out-String -Width 300 | Write-Host
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\screen.png")
            foreach ($f in "crash.log","fault.log","logs\jarvis.log","logs\hang-dump.txt") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 60 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          "$ok" | Out-File "$env:RUNNER_TEMP\windowed_ok.txt"
          if (-not $ok) { throw "windowed JARVIS.exe did not start" }
      - name: Notch on real Windows (window region + screenshots)
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome5"
          $env:JARVIS_NO_NET = "1"
          $shots = "$env:RUNNER_TEMP\notch-shots"
          New-Item -ItemType Directory -Force $shots | Out-Null
          # dark mode (as on the user's PC): pywebview then gives windows a Mica backdrop, which Windows painted as a
          # grey box around the notch (never seen here before, because this runner was always light)
          $pk = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $pk)) { New-Item -Path $pk -Force | Out-Null }
          Set-ItemProperty -Path $pk -Name AppsUseLightTheme -Value 0 -Type DWord
          $p = Start-Process -FilePath dist\JARVIS\JARVIS.exe -ArgumentList "--no-voice" -PassThru
          for ($i = 0; $i -lt 45; $i++) { Start-Sleep -Seconds 2; try { if ((Invoke-RestMethod -TimeoutSec 30 http://127.0.0.1:8765/api/health).name -eq "JARVIS") { break } } catch {} }
          Start-Sleep -Seconds 8
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Runtime.InteropServices;
          public static class W {
            [StructLayout(LayoutKind.Sequential)] public struct RECT { public int L, T, R, B; }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern IntPtr FindWindow(string c, string t);
            [DllImport("user32.dll")] public static extern int GetWindowRgnBox(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern int SetWindowRgn(IntPtr h, IntPtr r, bool redraw);
            [DllImport("user32.dll")] public static extern IntPtr SendMessageTimeout(IntPtr h, uint m, IntPtr w, IntPtr l, uint f, uint ms, out IntPtr r);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);
            public delegate bool EnumProc(IntPtr h, IntPtr l);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr l);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, System.Text.StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            // a visible window of this process whose title contains the needle ("Notch", "JARVIS Chat")
            public static IntPtr Notch(uint pid, System.Collections.Generic.List<string> seen) { return Find(pid, seen, "Notch"); }
            public static IntPtr Find(uint pid, System.Collections.Generic.List<string> seen, string needle) {
              IntPtr found = IntPtr.Zero;
              EnumWindows((h, l) => { uint p; GetWindowThreadProcessId(h, out p);
                if (p == pid && IsWindowVisible(h)) { var sb = new System.Text.StringBuilder(256); GetWindowText(h, sb, 256);
                  seen.Add(sb.ToString()); if (sb.ToString().Contains(needle)) { found = h; return false; } }
                return true; }, IntPtr.Zero);
              return found;
            }
          }
          "@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $w = [Math]::Min(1200, $b.Width); $x = [int](($b.Width - $w) / 2)
            $bmp = New-Object System.Drawing.Bitmap $w, 480
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($x, 0, 0, 0, $bmp.Size)
            $bmp.Save("$shots\$name.png")
          }
          function Region($label) {
            $seen = New-Object 'System.Collections.Generic.List[string]'
            $h = [W]::Notch([uint32]$p.Id, $seen)
            if ($h -eq [IntPtr]::Zero) { Write-Host "windows of JARVIS: $($seen -join ' | ')" }
            $wr = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$wr) | Out-Null
            $rr = New-Object W+RECT; $kind = [W]::GetWindowRgnBox($h, [ref]$rr)
            $line = "$label hwnd=$h window=($($wr.L),$($wr.T))-($($wr.R),$($wr.B)) regionKind=$kind box=($($rr.L),$($rr.T))-($($rr.R),$($rr.B))"
            Write-Host $line; Add-Content "$shots\region.txt" $line
            return $kind
          }
          function Corner($label) {   # a pixel inside the window rectangle but outside the notch: must be the backdrop
            $seen = New-Object 'System.Collections.Generic.List[string]'
            $h = [W]::Notch([uint32]$p.Id, $seen)
            $wr = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$wr) | Out-Null
            $rr = New-Object W+RECT; [W]::GetWindowRgnBox($h, [ref]$rr) | Out-Null
            # just left of the notch shape, near the top: inside the window rectangle (which may be wider than this
            # small screen) but outside the region. Not below it: a tall notice (e.g. "Telefon se k PC nepřipojí")
            # pushed that point down onto the JARVIS window opened by the first-run guide – a false "grey box"
            $px = [Math]::Max(0, $wr.L + $rr.L - 30); $py = $wr.T + $rr.T + 8
            $b = New-Object System.Drawing.Bitmap 1, 1
            [System.Drawing.Graphics]::FromImage($b).CopyFromScreen($px, $py, 0, 0, $b.Size)
            $c = $b.GetPixel(0, 0)
            $line = "corner $label rgb=($($c.R),$($c.G),$($c.B))"; Write-Host $line; Add-Content "$shots\region.txt" $line
            return ($c.R -gt 200 -and $c.G -lt 120)
          }
          function Rim($label) {   # smooth edges: a pixel just outside the shape but inside its window region must be the
            # backdrop – a white or grey rim there means per-pixel alpha does not work on this Windows
            $seen = New-Object 'System.Collections.Generic.List[string]'
            $h = [W]::Notch([uint32]$p.Id, $seen)
            $wr = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$wr) | Out-Null
            $rr = New-Object W+RECT; [W]::GetWindowRgnBox($h, [ref]$rr) | Out-Null
            $px = $wr.L + $rr.L; $py = $wr.T + [int](($rr.T + $rr.B) / 2)
            $b = New-Object System.Drawing.Bitmap 1, 1
            [System.Drawing.Graphics]::FromImage($b).CopyFromScreen($px, $py, 0, 0, $b.Size)
            $c = $b.GetPixel(0, 0)
            $line = "rim $label rgb=($($c.R),$($c.G),$($c.B))"; Write-Host $line; Add-Content "$shots\region.txt" $line
            return ($c.R -gt 200 -and $c.G -lt 120)
          }
          function Zoom($label) {
            # the notch window enlarged 6x without smoothing: jagged steps vs. anti-aliased edges are plain to see
            $seen = New-Object 'System.Collections.Generic.List[string]'
            $h = [W]::Notch([uint32]$p.Id, $seen)
            $wr = New-Object W+RECT; [W]::GetWindowRect($h, [ref]$wr) | Out-Null
            $w = $wr.R - $wr.L; $hh = [Math]::Min(140, $wr.B - $wr.T)
            if ($w -le 0 -or $hh -le 0) { return }
            $src = New-Object System.Drawing.Bitmap $w, $hh
            [System.Drawing.Graphics]::FromImage($src).CopyFromScreen($wr.L, $wr.T, 0, 0, $src.Size)
            # edge pixels that are neither the black notch nor the pink backdrop = anti-aliasing
            $aa = 0
            for ($y = 0; $y -lt $hh; $y++) { for ($x = 0; $x -lt $w; $x++) { $c = $src.GetPixel($x, $y)
              if ($c.R -gt 40 -and $c.R -lt 215 -and [Math]::Abs($c.G - $c.R * 0.2) -lt 30 -and [Math]::Abs($c.B - $c.R * 0.4) -lt 30) { $aa++ } } }
            $big = New-Object System.Drawing.Bitmap ($w * 6), ($hh * 6)
            $g = [System.Drawing.Graphics]::FromImage($big)
            $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::NearestNeighbor
            $g.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::Half
            $g.DrawImage($src, 0, 0, $big.Width, $big.Height); $big.Save("$shots\zoom-$label.png")
            $line = "zoom $label antialiased-edge-pixels=$aa"; Write-Host $line; Add-Content "$shots\region.txt" $line
          }
          # a bright backdrop under the notch (black consoles would hide jagged or smooth edges alike)
          $bd = New-Object System.Windows.Forms.Form
          $bd.FormBorderStyle = 'None'; $bd.BackColor = [System.Drawing.Color]::FromArgb(255, 255, 51, 102); $bd.ShowInTaskbar = $false
          $bdw = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
          $bd.StartPosition = 'Manual'; $bd.Bounds = New-Object System.Drawing.Rectangle 0, 0, $bdw, 320
          $bd.Show(); [System.Windows.Forms.Application]::DoEvents()
          $sw = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width
          [W]::SetCursorPos(10, 700) | Out-Null; Start-Sleep -Seconds 2; [System.Windows.Forms.Application]::DoEvents()
          # the first-run guide may open the JARVIS window after the backdrop: put the backdrop back on top (the notch is
          # topmost and stays above it)
          $bd.BringToFront(); [System.Windows.Forms.Application]::DoEvents(); Start-Sleep -Milliseconds 300
          Shot "1-closed"; $k1 = Region "closed"; Zoom "closed"; $c1 = Corner "closed"; $r1 = Rim "closed"
          [W]::SetCursorPos([int]($sw / 2), 8) | Out-Null; Start-Sleep -Milliseconds 1500
          [System.Windows.Forms.Application]::DoEvents()
          Shot "2-hover"; $k2 = Region "hover"; Zoom "hover"
          [W]::SetCursorPos(10, 700) | Out-Null; Start-Sleep -Seconds 2
          Shot "3-after"; $k3 = Region "after"
          if ($k3 -lt 2) {   # no region at all: the notch never sent its shape, so its window thread may be stuck – the heal
            # test below would then hang in SetWindowRgn for the whole timeout; show why instead and fail now
            try { Write-Host "health: $((Invoke-RestMethod -TimeoutSec 10 http://127.0.0.1:8765/api/health) | ConvertTo-Json -Compress)" } catch { Write-Host "health failed: $_" }
            Start-Sleep -Seconds 25
            Write-Host "== jarvis.log"; Get-Content "$env:JARVIS_HOME\logs\jarvis.log" -ErrorAction SilentlyContinue | Select-Object -Last 80 | Write-Host
            Write-Host "== hang-dump.txt"; Get-Content "$env:JARVIS_HOME\logs\hang-dump.txt" -ErrorAction SilentlyContinue | Select-Object -Last 200 | Write-Host
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the notch window has no region (regionKind=$k3): a box would show around the notch"
          }
          # Windows drops the region (seen on a user's PC: a grey box around the notch) → JARVIS must put it back
          $tmp = New-Object 'System.Collections.Generic.List[string]'
          $nh = [W]::Notch([uint32]$p.Id, $tmp); $res = [IntPtr]::Zero
          # SetWindowRgn waits for the window's own thread: first check that it answers at all (5 s), else show why
          if ([W]::SendMessageTimeout($nh, 0, [IntPtr]::Zero, [IntPtr]::Zero, 2, 5000, [ref]$res) -eq [IntPtr]::Zero) {
            Write-Host "the notch window does not answer (its GUI thread is stuck) – where every thread of JARVIS is:"
            try { Write-Host (Invoke-RestMethod -TimeoutSec 20 http://127.0.0.1:8765/api/debug/threads) } catch { Write-Host "threads: $_" }
            Write-Host "== jarvis.log"; Get-Content "$env:JARVIS_HOME\logs\jarvis.log" -ErrorAction SilentlyContinue | Select-Object -Last 80 | Write-Host
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            throw "the notch window stopped answering after start-up"
          }
          [W]::SetWindowRgn($nh, [IntPtr]::Zero, $true) | Out-Null
          Start-Sleep -Seconds 5; [System.Windows.Forms.Application]::DoEvents()
          Shot "3b-healed"; $k4 = Region "healed"
          $bd.Close()
          $smooth = Select-String -Path "$env:JARVIS_HOME\logs\jarvis.log" -Pattern "smooth edges" -ErrorAction SilentlyContinue | Select-Object -Last 1
          $line = "smooth: $smooth"; Write-Host $line; Add-Content "$shots\region.txt" $line
          $mica = Select-String -Path "$env:JARVIS_HOME\logs\jarvis.log" -Pattern "backdrop" -ErrorAction SilentlyContinue | Select-Object -Last 1
          $line = "backdrop: $mica"; Write-Host $line; Add-Content "$shots\region.txt" $line
          function Show($view) {   # on a hang: is the server alive at all, and where is its loop stuck (stall watch)
            try { Invoke-RestMethod -TimeoutSec 30 -Method Post "http://127.0.0.1:8765/api/show?view=$view" | Out-Null }
            catch {
              Write-Host "show $view failed: $_"
              try { Write-Host "health: $((Invoke-RestMethod -TimeoutSec 10 http://127.0.0.1:8765/api/health) | ConvertTo-Json -Compress)" } catch { Write-Host "health also failed: $_" }
              Start-Sleep -Seconds 25   # long enough for the no-GIL watchdog (20 s) to write every thread's stack
              Get-Content "$env:JARVIS_HOME\logs\jarvis.log" -ErrorAction SilentlyContinue | Select-Object -Last 60 | Write-Host
              Write-Host "== hang-dump.txt (all threads, written even when the whole interpreter is frozen)"
              Get-Content "$env:JARVIS_HOME\logs\hang-dump.txt" -ErrorAction SilentlyContinue | Select-Object -Last 200 | Write-Host
              throw "POST /api/show?view=$view did not answer"
            }
          }
          # 3.1: "Otevřít celý chat" creates a maximized window after start-up
          Show "full"
          $full = [IntPtr]::Zero; $seen = New-Object 'System.Collections.Generic.List[string]'
          for ($i = 0; $i -lt 20 -and $full -eq [IntPtr]::Zero; $i++) { Start-Sleep -Seconds 1; $seen.Clear(); $full = [W]::Find([uint32]$p.Id, $seen, "JARVIS Chat") }
          Start-Sleep -Seconds 4
          $sb = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $sb.Width, $sb.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen(0, 0, 0, 0, $bmp.Size); $bmp.Save("$shots\4-full-chat.png")
          $fr = New-Object W+RECT; [W]::GetWindowRect($full, [ref]$fr) | Out-Null
          # 3.2: the Stark HUD overlay (Ctrl+Alt+H) over the whole screen
          Show "hud"
          $hud = [IntPtr]::Zero
          for ($i = 0; $i -lt 20 -and $hud -eq [IntPtr]::Zero; $i++) { Start-Sleep -Seconds 1; $seen.Clear(); $hud = [W]::Find([uint32]$p.Id, $seen, "JARVIS HUD") }
          Start-Sleep -Seconds 5
          $bmp2 = New-Object System.Drawing.Bitmap $sb.Width, $sb.Height
          [System.Drawing.Graphics]::FromImage($bmp2).CopyFromScreen(0, 0, 0, 0, $bmp2.Size); $bmp2.Save("$shots\5-hud.png")
          $hr = New-Object W+RECT; [W]::GetWindowRect($hud, [ref]$hr) | Out-Null
          $hudLine = "hud hwnd=$hud window=($($hr.L),$($hr.T))-($($hr.R),$($hr.B))"
          Write-Host $hudLine; Add-Content "$shots\region.txt" $hudLine
          foreach ($f in "crash.log","logs\jarvis.log") { Write-Host "== $f"; Get-Content "$env:JARVIS_HOME\$f" -ErrorAction SilentlyContinue | Select-Object -Last 30 }
          $fullLine = "full chat hwnd=$full window=($($fr.L),$($fr.T))-($($fr.R),$($fr.B)) windows=$($seen -join ' | ')"
          Write-Host $fullLine; Add-Content "$shots\region.txt" $fullLine
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          # 0 = ERROR (no region), 1 = NULLREGION: the notch would show a box around it
          if ($k1 -lt 2) { throw "the notch window has no region: there would be a box around the notch" }
          if ($k4 -lt 2) { throw "the notch region did not come back after Windows dropped it" }
          if (-not $c1) { throw "something is painted around the notch inside its window (grey box): see corner in region.txt" }
          if ($smooth -and -not $r1) { throw "smooth edges are on but a rim is painted right around the notch: see rim in region.txt" }
          if ($full -eq [IntPtr]::Zero) { throw "the full chat window did not open" }
          if ($hud -eq [IntPtr]::Zero) { throw "the Stark HUD did not open" }
          if (($hr.R - $hr.L) -lt $sb.Width * 0.95) { throw "the Stark HUD does not cover the screen" }
          if (($fr.R - $fr.L) -lt $sb.Width * 0.8) { throw "the full chat window is not maximized" }
      - uses: actions/upload-artifact@v5
        if: always()
        continue-on-error: true   # screenshots are for diagnosis only – a full artifact quota must not fail the build
        with: { name: notch-shots, path: "${{ runner.temp }}/notch-shots", retention-days: 7 }
      - name: Idle benchmark and UI Automation selftest
        timeout-minutes: 22
        shell: pwsh
        run: |
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome3"
          $env:JARVIS_NO_NET = "1"
          $bench = & dist\JARVIS\JARVIS-debug.exe --bench 30 --bench-gate 2>$null
          $code = $LASTEXITCODE
          Write-Host "BENCH (targets: CPU < 2 %, RAM < 400 MB; gate 2x): $($bench | Select-Object -Last 1)"
          $uia = & dist\JARVIS\JARVIS-debug.exe --selftest-uia 2>$null
          Write-Host "UIA SELFTEST: $($uia | Select-Object -Last 1)"
          $pw = & dist\JARVIS\JARVIS-debug.exe --selftest-powers 2>$null
          Write-Host "POWERS SELFTEST (selected text in Notepad): $($pw | Select-Object -Last 1)"
          $pwr = ($pw | Select-Object -Last 1) | ConvertFrom-Json
          if (-not $pwr.skipped -and -not $pwr.ok) { throw "selected text or running apps: JARVIS did not read, replace or see Notepad correctly" }
          $rpOut = "$env:RUNNER_TEMP\report-selftest.txt"
          $rpProc = Start-Process -FilePath dist\JARVIS\JARVIS-debug.exe -ArgumentList "--selftest-report" -RedirectStandardOutput $rpOut -NoNewWindow -PassThru
          if (-not $rpProc.WaitForExit(240000)) { $rpProc.Kill(); Get-Content $rpOut | Write-Host; throw "PC report selftest hung (over 4 minutes); the last stage above is where" }
          Get-Content $rpOut | Select-Object -SkipLast 1 | Write-Host
          $rp = Get-Content $rpOut
          Write-Host "PC REPORT SELFTEST (read-only diagnostics, verified file): $($rp | Select-Object -Last 1)"
          $rpr = ($rp | Select-Object -Last 1) | ConvertFrom-Json
          if (-not $rpr.ok -or $rpr.unknown.Count -gt 0) { throw "PC report: not verified or some part could not be measured on Windows" }
          $rsOut = "$env:RUNNER_TEMP\rescue-selftest.txt"
          $rsProc = Start-Process -FilePath dist\JARVIS\JARVIS-debug.exe -ArgumentList "--selftest-rescue" -RedirectStandardOutput $rsOut -NoNewWindow -PassThru
          if (-not $rsProc.WaitForExit(480000)) { $rsProc.Kill(); Get-Content $rsOut | Write-Host; throw "PC rescue selftest hung (over 8 minutes); the last stage above is where" }
          $rs = Get-Content $rsOut
          Write-Host "PC RESCUE SELFTEST (11 read-only probes, verified report, performance): $($rs | Select-Object -Last 1)"
          $rsr = ($rs | Select-Object -Last 1) | ConvertFrom-Json
          if (-not $rsr.ok) { throw "PC rescue: a probe did not return data or the report was not verified" }
          if ($code -ne 0) { throw "idle cost above 2x target" }
      - uses: actions/upload-artifact@v5
        if: failure()
        continue-on-error: true
        with: { name: windowed-screen, path: "${{ runner.temp }}/screen.png", retention-days: 7 }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=$env:JARVIS_VERSION" packaging\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
      - name: Sign JARVIS-Setup.exe (only with the certificate secrets, as above)
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          $pfx = "$env:RUNNER_TEMP\cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $st.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 dist\JARVIS-Setup.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Remove-Item $pfx
      - name: Installer smoke test (fresh install, then an upgrade over it, then start)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $d = "$env:RUNNER_TEMP\jarvis-installed"
          $env:JARVIS_HOME = "$env:RUNNER_TEMP\jhome4"
          $env:JARVIS_NO_NET = "1"
          foreach ($i in 1..2) {
            $log = "$env:RUNNER_TEMP\setup$i.log"
            # -Wait would also wait for the JARVIS the setup starts at the end: wait for the setup only
            $p = Start-Process dist\JARVIS-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=`"$d`"", "/LOG=`"$log`"" -PassThru
            if (-not $p.WaitForExit(300000)) { Get-Content $log -Tail 60; throw "setup #$i did not finish in 5 minutes" }
            Start-Sleep -Seconds 3
            Get-Process JARVIS -ErrorAction SilentlyContinue | Stop-Process -Force
            if ($p.ExitCode -ne 0) { Get-Content $log -Tail 60; throw "setup #$i failed with exit code $($p.ExitCode)" }
          }
          # the user's PC: "CreateFile selhala; kód 5" while saving the uninstall data. Recreate the worst case – an old
          # unins000.dat next to JARVIS.exe that is locked by another process and read-only + hidden + system, and the
          # current uninstall data hidden + system – and the upgrade must still finish
          $old = "$d\unins000.dat"
          Set-Content -Path $old -Value "old uninstall data"
          attrib +r +h +s $old
          attrib +h +s "$d\uninstall\unins000.dat"
          $holder = Start-Process pwsh -PassThru -WindowStyle Hidden -ArgumentList "-NoProfile", "-Command", "`$f = [IO.File]::Open('$old', 'Open', 'Read', 'None'); Start-Sleep 600"
          Start-Sleep -Seconds 3
          $log = "$env:RUNNER_TEMP\setup3.log"
          $p = Start-Process dist\JARVIS-Setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/TASKS=", "/DIR=`"$d`"", "/LOG=`"$log`"" -PassThru
          if (-not $p.WaitForExit(300000)) { Get-Content $log -Tail 60; throw "setup #3 did not finish in 5 minutes" }
          Start-Sleep -Seconds 3
          Get-Process JARVIS -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $holder.Id -Force -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw "setup #3 (locked + hidden uninstall data) failed with exit code $($p.ExitCode)" }
          if (-not (Test-Path "$d\uninstall\unins000.exe")) { throw "uninstaller missing in $d\uninstall" }
          Get-Content $log | Select-String "JARVIS:|unins" | Select-Object -Last 8
          if (-not (Test-Path "$d\JARVIS.exe")) { throw "JARVIS.exe missing after install" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\JARVIS.lnk")) { Write-Host "warning: Start menu shortcut missing" }
          $out = & "$d\JARVIS-debug.exe" --bench 5 2>&1 | Select-Object -Last 20
          $code = $LASTEXITCODE
          Write-Host ($out | Select-Object -Last 3)
          if ($code -ne 0) { Get-Content "$env:JARVIS_HOME\crash.log" -ErrorAction SilentlyContinue; throw "the installed JARVIS does not start" }
      - uses: actions/cache/save@v4
        with:
          path: dist/JARVIS-Setup.exe
          key: setup-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  android:
    needs: [web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: web/dist
          key: web-dist-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - run: bash mobile/build-android.sh
      - uses: actions/cache/save@v4
        with:
          path: mobile/JARVIS.apk
          key: apk-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true

  wear:                           # 3.18 JARVIS for Wear OS watches – its own small project, its own APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle -p mobile/wear assembleDebug --no-daemon --stacktrace
      - run: cp mobile/wear/app/build/outputs/apk/debug/app-debug.apk JARVIS-wear.apk
      - uses: actions/upload-artifact@v5
        with:
          name: JARVIS-wear
          path: JARVIS-wear.apk
          retention-days: 30

  android-ui:                     # 3.17 the APK in a real emulator: starts, stays up, widget offered, no crash
    needs: [android]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache/restore@v4
        with:
          path: mobile/JARVIS.apk
          key: apk-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash mobile/emulator-smoke.sh "${{ runner.temp }}/android-shots"
      - uses: actions/upload-artifact@v5
        if: always()
        with: { name: android-shots, path: "${{ runner.temp }}/android-shots", retention-days: 7 }

  release:
    needs: [test, windows, windows-tests, android]
    # the default branch = stable releases; the `beta` branch = test builds (pre-release, only the beta channel gets them)
    if: github.ref_name == github.event.repository.default_branch || github.ref_name == 'beta' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: dist/JARVIS-Setup.exe
          key: setup-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: mobile/JARVIS.apk
          key: apk-${{ github.run_id }}-${{ github.run_attempt }}
          enableCrossOsArchive: true
          fail-on-cache-miss: true
      - run: mkdir -p out && cp dist/JARVIS-Setup.exe mobile/JARVIS.apk out/ && ls -la out
      - uses: actions/checkout@v5
        with: { path: src, sparse-checkout: packaging/winget }
      - name: winget manifests (3.14 návrh 115 – attached to the release, submitted to winget-pkgs by hand)
        run: |
          python3 src/packaging/winget/make_manifest.py "$JARVIS_VERSION" out/JARVIS-Setup.exe out/winget "$GITHUB_REPOSITORY"
          (cd out && zip -r winget-manifests.zip winget)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.JARVIS_VERSION }}
          name: JARVIS ${{ env.JARVIS_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: ${{ github.ref_name != 'beta' }}
          prerelease: ${{ github.ref_name == 'beta' }}
          body: |
            ## Stáhni a nainstaluj
            - **PC (Windows 10/11):** `JARVIS-Setup.exe` → spusť a klikni Další.
            - **Telefon (Android):** `JARVIS.apk` → otevři v telefonu, povol instalaci z tohoto zdroje.
            - Spárování: na PC otevři JARVIS → Telefon a naskenuj QR kód v aplikaci.
          files: |
            out/JARVIS-Setup.exe
            out/JARVIS.apk
            out/winget-manifests.zip
